# Static site: no build step. Netlify serves the contents of public/ as-is.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Client demo for Digital Accounting & Tax: viewable by link, never indexed.
[[headers]]
  for = "/Digital-Accounting-Tax/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
