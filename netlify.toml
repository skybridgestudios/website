# Static site: no build step. Netlify serves the contents of public/ as-is.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Private client demos (public/clientes/<slug>/): viewable by access link, never indexed.
# Access is checked by netlify/edge-functions/acceso-clientes/.
[[headers]]
  for = "/clientes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
